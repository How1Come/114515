<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon/icon.png">
    <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
    <title>魔法少女天穹法妮雅 v1.05 — with Cheat Menu</title>

    <style>
      /* Same styles as before — unchanged */
      #cheatPanel {position:fixed;top:0;right:-380px;width:380px;height:100%;background:rgba(17,17,17,.98);color:#fff;overflow-y:auto;z-index:99998;padding:12px;box-sizing:border-box;transition:right .28s;font-family:Arial,sans-serif;font-size:14px;-webkit-overflow-scrolling:touch;border-left:1px solid rgba(255,255,255,.04);pointer-events:auto}
      #cheatPanel.open{right:0}
      #cheatPanel h2{margin:8px 0 10px;font-size:16px;border-bottom:1px solid #444;padding-bottom:6px}
      #cheatClose{position:sticky;top:0;background:#333;border:1px solid #555;color:#fff;border-radius:6px;padding:6px 10px;margin-bottom:8px;cursor:pointer;-webkit-user-select:none}
      #cheatTabs{margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px}
      #cheatTabs button{background:#2a2a2a;border:1px solid #555;color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
      #cheatPanel label{display:inline-block;width:120px;vertical-align:middle}
      #cheatPanel input[type="number"],#cheatPanel input[type="text"],#cheatPanel select{width:120px;margin-right:6px;padding:4px;box-sizing:border-box;vertical-align:middle}
      #cheatPanel .row{margin:8px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
      #cheatPanel hr{border:0;border-top:1px solid #333;margin:8px 0}
      #cheatPanel .sub{color:#bbb;font-size:12px;margin-top:6px}
      #cheatFab{position:fixed;right:12px;top:50%;transform:translateY(-50%);width:44px;height:44px;line-height:44px;text-align:center;border-radius:22px;background:rgba(34,34,34,.95);color:#fff;border:1px solid #555;box-shadow:0 2px 10px rgba(0,0,0,.35);z-index:100000;cursor:pointer;user-select:none;pointer-events:auto}
      #escButton{position:fixed;left:12px;bottom:12px;width:64px;height:64px;border-radius:50%;background:rgba(68,68,68,0.95);color:#fff;border:1px solid #555;font-size:16px;font-weight:bold;z-index:100000;cursor:pointer;user-select:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.35);pointer-events:auto}
      #cheatOverlay{position:fixed;inset:0;z-index:99990;display:none;pointer-events:none;background:rgba(0,0,0,0.02)}
      #cheatOverlay.active{display:block;pointer-events:auto}
      .btn{background:#2c2c2c;border:1px solid #555;padding:6px 10px;border-radius:6px;color:#fff;cursor:pointer}
      .btn.small{padding:4px 8px;font-size:13px}
      .muted{color:#9aa;font-size:13px}
      .status{font-size:13px;margin-top:8px;color:#9df}
      canvas,body{-webkit-user-select:none;user-select:none;touch-action:manipulation}
    </style>
  </head>
  <body style="background-color:black">
    <!-- RPG Maker MV core -->
    <script src="js/libs/pixi.js"></script>
    <script src="js/libs/pixi-tilemap.js"></script>
    <script src="js/libs/pixi-picture.js"></script>
    <script src="js/libs/fpsmeter.js"></script>
    <script src="js/libs/lz-string.js"></script>
    <script src="js/libs/iphone-inline-video.browser.js"></script>
    <script src="js/rpg_core.js"></script>
    <script src="js/rpg_managers.js"></script>
    <script src="js/rpg_objects.js"></script>
    <script src="js/rpg_scenes.js"></script>
    <script src="js/rpg_sprites.js"></script>
    <script src="js/rpg_windows.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>

    <div id="cheatOverlay" aria-hidden="true"></div>
    <div id="cheatFab" title="Open cheats">≡</div>

    <div id="cheatPanel" aria-hidden="true">
      <button id="cheatClose" class="btn small">Close</button>
      <h2>Cheat Menu</h2>
      <div id="cheatTabs">
        <button data-tab="money">Money</button>
        <button data-tab="items">Items</button>
        <button data-tab="actors">Actors</button>
        <button data-tab="time">Time</button>
        <button data-tab="vars">Vars</button>
        <button data-tab="settings">Settings</button>
      </div>
      <div id="cheatContent" class="muted">Choose a tab…</div>
    </div>

    <button id="escButton" type="button" title="Open menu (ESC)">ESC</button>

    <script>
    (function(){
      const panel = document.getElementById('cheatPanel');
      const content = document.getElementById('cheatContent');
      const fab = document.getElementById('cheatFab');
      const close = document.getElementById('cheatClose');
      const overlay = document.getElementById('cheatOverlay');
      const escButton = document.getElementById('escButton');
      const tabsContainer = document.getElementById('cheatTabs');

      function openPanel(){
        panel.classList.add('open');
        panel.setAttribute('aria-hidden','false');
        overlay.classList.add('active');
        fab.style.display='none';
      }
      function closePanel(){
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden','true');
        overlay.classList.remove('active');
        fab.style.display='block';
      }

      fab.addEventListener('click', openPanel, {passive:false});
      fab.addEventListener('touchstart', openPanel, {passive:false});
      close.addEventListener('click', closePanel, {passive:false});
      close.addEventListener('touchstart', closePanel, {passive:false});
      overlay.addEventListener('click', (ev)=>{ if(!panel.contains(ev.target)) closePanel(); }, {passive:false});

      // ⬇️ FIX: Add working tab switching for both click and touch
      function handleTabChange(e){
        const btn = e.target.closest('button[data-tab]');
        if(!btn) return;
        e.preventDefault();
        const tab = btn.dataset.tab;
        showCheatTab(tab);
      }
      tabsContainer.addEventListener('click', handleTabChange, {passive:false});
      tabsContainer.addEventListener('touchstart', handleTabChange, {passive:false});

      // ============= CHEAT CORE =============
      function el(tag, html){const e=document.createElement(tag);if(html)e.innerHTML=html;return e;}
      function escapeHtml(s){return s?s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])):'';}

      window.showCheatTab = function(tab){
        content.innerHTML='';
        if(tab==='money')return renderMoney(content);
        if(tab==='items')return renderItems(content);
        if(tab==='actors')return renderActors(content);
        if(tab==='time')return renderTime(content);
        if(tab==='vars')return renderVars(content);
        if(tab==='settings')return renderSettings(content);
      };

      function renderMoney(c){
        const w=el('div');
        if(!$gameParty){c.textContent='Game not loaded';return;}
        const g=$gameParty.gold();
        w.innerHTML=`<div class="row"><label>Money</label><input type="number" id="gm" value="${g}"><button id="setM" class="btn small">Set</button></div>`;
        c.appendChild(w);
        w.querySelector('#setM').addEventListener('click',()=>{$gameParty._gold=+document.getElementById('gm').value;alert('Money set!')});
      }
      function renderItems(c){const w=el('div');w.textContent='(Items)';c.appendChild(w);}
      function renderActors(c){const w=el('div');w.textContent='(Actors)';c.appendChild(w);}
      function renderTime(c){const w=el('div');w.textContent='(Time)';c.appendChild(w);}
      function renderVars(c){const w=el('div');w.textContent='(Vars)';c.appendChild(w);}
      function renderSettings(c){const w=el('div');w.textContent='(Settings)';c.appendChild(w);}

      // ============= ESC logic =============
      escButton.addEventListener('click',()=>{try{if(SceneManager)SceneManager.push(Scene_Menu);}catch(e){console.log(e)}});

    })();
    </script>
  </body>
</html>
