<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon/icon.png">
    <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
    <title>魔法少女天穹法妮雅 v1.05 (with Cheat Menu)</title>

    <style>
      /* ===== Cheat sidebar ===== */
      #cheatPanel {
        position: fixed;
        top: 0;
        right: -380px;                /* hidden */
        width: 380px;
        height: 100%;
        background: rgba(17,17,17,.98);
        color: #fff;
        overflow-y: auto;
        z-index: 100002;
        padding: 12px 12px 20px 12px;
        box-sizing: border-box;
        transition: right .28s ease;
        font-family: Arial, sans-serif;
        font-size: 14px;
        -webkit-overflow-scrolling: touch;
        border-left: 1px solid rgba(255,255,255,.04);
        touch-action: auto; /* allow pointer events delivery */
        -webkit-user-select: none;
      }
      #cheatPanel.open { right: 0; }
      #cheatPanel h2 {
        margin: 8px 0 10px;
        font-size: 16px;
        border-bottom: 1px solid #444;
        padding-bottom: 6px;
      }
      #cheatClose {
        position: sticky;
        top: 0;
        display: inline-block;
        background: #333;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 8px;
        cursor: pointer;
        -webkit-user-select: none;
      }
      #cheatTabs { margin-bottom:10px; display:flex; flex-wrap:wrap; gap:8px; }
      #cheatTabs button {
        background: #2a2a2a;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size:13px;
        -webkit-user-select: none;
      }
      #cheatPanel label { display:inline-block; width:120px; vertical-align:middle; }
      #cheatPanel input[type="number"], #cheatPanel input[type="text"], #cheatPanel select { width:120px; margin-right:6px; padding:4px; box-sizing:border-box; vertical-align:middle; }
      #cheatPanel .row { margin: 8px 0; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
      #cheatPanel hr { border: 0; border-top: 1px solid #333; margin: 8px 0; }
      #cheatPanel .sub { color:#bbb; font-size:12px; margin-top:6px; }

      /* Floating open button */
      #cheatFab {
        position: fixed;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        line-height: 44px;
        text-align: center;
        border-radius: 22px;
        background: rgba(34,34,34,.95);
        color: #fff;
        border: 1px solid #555;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
        z-index: 100003;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }

      /* Virtual ESC button (fixed at left corner) */
      #escButton {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(68,68,68,0.95);
        color: #fff;
        border: 1px solid #555;
        font-size: 16px;
        font-weight: bold;
        z-index: 100003;
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
        -webkit-user-select: none;
      }

      /* small helper */
      .btn { background:#2c2c2c;border:1px solid #555;padding:6px 10px;border-radius:6px;color:#fff;cursor:pointer }
      .btn.small { padding:4px 8px; font-size:13px }
      .muted { color:#9aa; font-size:13px }
      .status { font-size:13px; margin-top:8px; color:#9df; }
      .danger { color:#f88; }
      .ok { color:#8f8; }

      /* ensure overlays only handle their pointer area */
      #cheatPanel, #cheatFab, #escButton { pointer-events: auto; }
      canvas, body { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    </style>
  </head>

  <body style="background-color: black">
    <!-- RPG Maker MV core files (keep originals) -->
    <script type="text/javascript" src="js/libs/pixi.js"></script>
    <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
    <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
    <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
    <script type="text/javascript" src="js/libs/lz-string.js"></script>
    <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
    <script type="text/javascript" src="js/rpg_core.js"></script>
    <script type="text/javascript" src="js/rpg_managers.js"></script>
    <script type="text/javascript" src="js/rpg_objects.js"></script>
    <script type="text/javascript" src="js/rpg_scenes.js"></script>
    <script type="text/javascript" src="js/rpg_sprites.js"></script>
    <script type="text/javascript" src="js/rpg_windows.js"></script>
    <script type="text/javascript" src="js/plugins.js"></script>
    <script type="text/javascript" src="js/main.js"></script>

    <!-- Floating open button -->
    <div id="cheatFab" title="Open cheats" role="button" tabindex="0">≡</div>

    <!-- Cheat panel -->
    <div id="cheatPanel" aria-hidden="true">
      <button id="cheatClose" class="btn small" type="button">Close</button>
      <h2>Cheat Menu</h2>
      <div id="cheatTabs" aria-hidden="false">
        <button type="button" data-tab="money">Money</button>
        <button type="button" data-tab="items">Items</button>
        <button type="button" data-tab="actors">Actors</button>
        <button type="button" data-tab="time">Time</button>
        <button type="button" data-tab="vars">Vars</button>
        <button type="button" data-tab="settings">Settings</button>
      </div>

      <div id="cheatContent" class="muted">Choose a tab…</div>
    </div>

    <!-- Virtual ESC (opens menu reliably on mobile) -->
    <button id="escButton" type="button" title="Open menu (ESC)">ESC</button>

    <script>
    (function(){
      /* =========================
         Utility helpers
         ========================= */
      function el(tag, html) { const d = document.createElement(tag); if (html !== undefined) d.innerHTML = html; return d; }
      function escapeHtml(s) { if (!s && s !== 0) return ''; return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
      function isFunction(v){ return typeof v === 'function'; }

      /* =========================
         Elements and basic UI
         ========================= */
      const fab = document.getElementById('cheatFab');
      const panel = document.getElementById('cheatPanel');
      const closeBtn = document.getElementById('cheatClose');
      const content = document.getElementById('cheatContent');
      const tabsRoot = document.getElementById('cheatTabs');
      const escBtn = document.getElementById('escButton');

      function openPanel(){
        panel.classList.add('open');
        panel.setAttribute('aria-hidden','false');
        fab.style.display = 'none';
        // prevent page scroll while open on mobile
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
        // render current tab or default
        const cur = panel.dataset.tab || 'money';
        showCheatTab(cur);
      }
      function closePanel(){
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden','true');
        fab.style.display = 'block';
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
      }

      // Pointer-friendly binding (works with mouse, touch, pen, etc.)
      function bindPointerOnce(elem, type, handler){
        if(!elem) return;
        elem.addEventListener(type, handler, {passive:false});
      }

      // open/close wiring: prefer pointerdown/pointerup; also add click fallback
      bindPointerOnce(fab, 'pointerup', (e)=>{ e.preventDefault(); openPanel(); });
      fab.addEventListener('click', openPanel);
      // touch fallback attribute for some iOS quirks
      fab.setAttribute('ontouchstart', 'void(0)');

      bindPointerOnce(closeBtn, 'pointerup', (e)=>{ e.preventDefault(); closePanel(); });
      closeBtn.addEventListener('click', closePanel);
      closeBtn.setAttribute('ontouchstart', 'void(0)');

      // delegates for tab buttons
      tabsRoot.addEventListener('pointerup', (ev)=>{
        const b = ev.target.closest('button[data-tab]');
        if(!b) return;
        ev.preventDefault();
        const tab = b.dataset.tab;
        showCheatTab(tab);
        panel.dataset.tab = tab;
      }, {passive:false});
      tabsRoot.addEventListener('click', (ev)=>{ /* click fallback handled above */ });

      /* =========================
         Autosave state (OFF default)
         ========================= */
      let autosaveTimer = null;
      let autosaveEnabled = false;
      let autosaveIntervalMs = 5 * 60 * 1000; // default when enabled
      let autosaveSlot = 1;

      function enableAutosave(enabled){
        autosaveEnabled = !!enabled;
        if(autosaveTimer){ clearInterval(autosaveTimer); autosaveTimer = null; }
        if(autosaveEnabled){
          autosaveTimer = setInterval(()=> {
            try { doSave(autosaveSlot, true); } catch(e) { console.warn('Auto-save failed', e); }
          }, autosaveIntervalMs);
        }
        renderSettingsStatus();
      }
      function renderSettingsStatus(){
        const s = document.getElementById('settingsStatus');
        if(!s) return;
        s.textContent = autosaveEnabled ? `Auto-save: every ${autosaveIntervalMs/60000} min (slot ${autosaveSlot})` : `Auto-save: OFF`;
      }

      /* =========================
         Save / Load helpers
         ========================= */
      async function doSave(slot, silent){
        if(!window.DataManager || typeof DataManager.saveGame !== 'function'){
          alert('Save function not available in this environment.');
          return;
        }
        slot = Number(slot) || 1;
        try {
          const ok = await DataManager.saveGame(slot);
          if(!silent) alert(ok ? `Saved slot ${slot}` : `Save failed`);
        } catch(e){
          console.error('Save error', e);
          alert('Save failed: '+(e && e.message ? e.message : e));
        }
      }

      async function doLoad(slot){
        if(!window.DataManager || typeof DataManager.loadGame !== 'function'){
          alert('Load function not available in this environment.');
          return;
        }
        slot = Number(slot) || 1;
        try {
          const ok = await DataManager.loadGame(slot);
          if(ok) {
            // try to refresh in-game without full reload when possible
            if(window.SceneManager && isFunction(SceneManager.reload)) {
              SceneManager.reload();
            } else {
              location.reload();
            }
          } else {
            alert('Load failed (no saved data).');
          }
        } catch(e) {
          console.error('Load error', e);
          alert('Load failed: '+(e && e.message ? e.message : e));
        }
      }

      // Expose for console
      window.__doSave = doSave;
      window.__doLoad = doLoad;

      /* =========================
         Tab system
         ========================= */
      window.showCheatTab = function(tab){
        panel.dataset.tab = tab;
        content.innerHTML = '';
        try {
          if(tab === 'money') return renderMoneyTab(content);
          if(tab === 'items') return renderItemsTab(content);
          if(tab === 'actors') return renderActorsTab(content);
          if(tab === 'time') return renderTimeTab(content);
          if(tab === 'vars') return renderVarsTab(content);
          if(tab === 'settings') return renderSettingsTab(content);
        } catch (e) {
          content.textContent = 'Error rendering tab: ' + (e.message || e);
          console.error(e);
        }
      };

      /* =========================
         Money Tab
         ========================= */
      function renderMoneyTab(container){
        const wrap = el('div');
        if(!window.$gameParty){
          wrap.textContent = 'Game not loaded yet.';
          container.appendChild(wrap);
          return;
        }
        const gold = (typeof $gameParty.gold === 'function') ? $gameParty.gold() : ($gameParty._gold || 0);
        const row = el('div');
        row.className = 'row';
        row.innerHTML =
          `<label>Money</label>
           <input type="number" id="cheat-money" value="${gold}" min="0">
           <button class="btn small" id="btn-set-money">Set</button>
           <button class="btn small" id="btn-add-money">+1000</button>`;
        wrap.appendChild(row);
        container.appendChild(wrap);

        // pointer-friendly bindings
        const setBtn = row.querySelector('#btn-set-money');
        bindPointerOnce(setBtn, 'pointerup', (e)=>{ e.preventDefault(); setMoneyFromUI(); });
        setBtn.addEventListener('click', setMoneyFromUI);

        const addBtn = row.querySelector('#btn-add-money');
        bindPointerOnce(addBtn, 'pointerup', (e)=>{ e.preventDefault(); addMoney(); });
        addBtn.addEventListener('click', addMoney);

        function setMoneyFromUI(){
          const v = parseInt(document.getElementById('cheat-money').value, 10);
          if(!isNaN(v) && window.$gameParty) {
            if(typeof $gameParty._gold !== 'undefined') $gameParty._gold = v;
            if(typeof $gameParty.gainGold === 'function') {
              const cur = (typeof $gameParty.gold === 'function') ? $gameParty.gold() : ($gameParty._gold || 0);
              $gameParty.gainGold(v - cur);
            }
            alert('Money set to '+v);
          }
        }
        function addMoney(){
          if(!window.$gameParty) return;
          if(typeof $gameParty.gainGold === 'function') $gameParty.gainGold(1000);
          else if(typeof $gameParty._gold !== 'undefined') $gameParty._gold = ($gameParty._gold || 0) + 1000;
          const newv = (typeof $gameParty.gold === 'function') ? $gameParty.gold() : ($gameParty._gold || 0);
          document.getElementById('cheat-money').value = newv;
          alert('Added 1000. Now '+newv);
        }
      }

      /* =========================
         Items Tab
         ========================= */
      function renderItemsTab(container){
        const wrap = el('div');
        if(!window.$dataItems || !window.$gameParty){
          wrap.textContent = 'Game not loaded yet.';
          container.appendChild(wrap);
          return;
        }
        // render each item (could be many — but user asked full listing)
        $dataItems.forEach(item => {
          if (!item) return;
          const id = item.id;
          const count = $gameParty.numItems ? $gameParty.numItems(item) : 0;
          const row = el('div');
          row.className = 'row';
          row.innerHTML =
            `<label style="width:160px">${escapeHtml(item.name || ('Item '+id))}</label>
             <input type="number" id="cheat-item-${id}" value="${count}" min="0">
             <button class="btn small" data-id="${id}">Set</button>`;
          wrap.appendChild(row);
        });
        container.appendChild(wrap);

        // delegated pointer handler
        wrap.addEventListener('pointerup', (ev) => {
          const b = ev.target.closest('button[data-id]');
          if(!b) return;
          ev.preventDefault();
          setItemFromButton(Number(b.dataset.id));
        }, {passive:false});
        wrap.addEventListener('click', (ev)=>{}); // fallback

        function setItemFromButton(id){
          const input = document.getElementById('cheat-item-'+id);
          const v = parseInt(input.value, 10);
          if(isNaN(v)) return;
          const item = $dataItems[id];
          const cur = $gameParty.numItems(item);
          $gameParty.gainItem(item, v - cur);
          alert('Item '+(item.name||id)+' set to '+v);
        }
      }

      /* =========================
         Actors Tab
         ========================= */
      function renderActorsTab(container){
        const wrap = el('div');
        if(!window.$gameActors || !window.$gameParty){
          wrap.textContent = 'Game not loaded yet.';
          container.appendChild(wrap);
          return;
        }
        $gameParty.members().forEach(actor => {
          const id = actor.actorId();
          const block = el('div');
          block.style.borderTop = '1px solid rgba(255,255,255,.04)';
          block.style.paddingTop = '8px';
          block.innerHTML =
            `<div style="font-weight:700">${escapeHtml(actor.name())}</div>
             <div class="row"><label>HP</label><input type="number" id="hp-${id}" value="${actor.hp}" min="0"><button class="btn small" data-set-hp="${id}">Set</button></div>
             <div class="row"><label>MP</label><input type="number" id="mp-${id}" value="${actor.mp}" min="0"><button class="btn small" data-set-mp="${id}">Set</button></div>
             <div class="row"><label>Level</label><input type="number" id="lv-${id}" value="${actor.level}" min="1"><button class="btn small" data-set-lv="${id}">Set</button></div>`;
          wrap.appendChild(block);
        });
        container.appendChild(wrap);

        // delegated pointer handling
        wrap.addEventListener('pointerup', (ev) => {
          const hpBtn = ev.target.closest('button[data-set-hp]');
          if(hpBtn){
            ev.preventDefault();
            const id = Number(hpBtn.getAttribute('data-set-hp'));
            const val = parseInt(document.getElementById('hp-'+id).value, 10);
            if(!isNaN(val)){ const a = $gameActors.actor(id); if(a && isFunction(a.setHp)) a.setHp(val); alert('HP set'); }
            return;
          }
          const mpBtn = ev.target.closest('button[data-set-mp]');
          if(mpBtn){
            ev.preventDefault();
            const id = Number(mpBtn.getAttribute('data-set-mp'));
            const val = parseInt(document.getElementById('mp-'+id).value, 10);
            if(!isNaN(val)){ const a = $gameActors.actor(id); if(a && isFunction(a.setMp)) a.setMp(val); alert('MP set'); }
            return;
          }
          const lvBtn = ev.target.closest('button[data-set-lv]');
          if(lvBtn){
            ev.preventDefault();
            const id = Number(lvBtn.getAttribute('data-set-lv'));
            const val = parseInt(document.getElementById('lv-'+id).value, 10);
            if(!isNaN(val)){ const a = $gameActors.actor(id); if(a && isFunction(a.changeLevel)) a.changeLevel(val,false); alert('Level set'); }
            return;
          }
        }, {passive:false});

      }

      /* =========================
         Time Tab (Chronus if present)
         ========================= */
      // Default Chronus-like variable IDs you previously mentioned (best-effort)
      const chronusFallbackVars = { weekday:135, month:137, day:139, hour:239, minute:240 };

      function renderTimeTab(container){
        const wrap = el('div');
        if(!window.$gameVariables){
          wrap.textContent = 'Game not loaded yet.';
          container.appendChild(wrap);
          return;
        }

        wrap.appendChild(el('div', '<div class="sub">This tab will attempt to set Chronus time (preferred). If Chronus is absent it will set variables. After setting, Chronus (if present) will refresh in-game effects.</div>'));

        // Show fields: year (if Chronus supports), month, day, hour, minute
        const row1 = el('div'); row1.className = 'row';
        row1.innerHTML = `<label style="width:90px">Year</label><input type="number" id="time-year" value="${(window.$gameSystem && $gameSystem.chronus) ? $gameSystem.chronus().getYear() : 1}" min="1" style="width:90px"><label style="width:60px">Month</label><input type="number" id="time-month" value="${(window.$gameSystem && $gameSystem.chronus) ? $gameSystem.chronus().getMonth() : $gameVariables.value(chronusFallbackVars.month)||1}" min="1" style="width:70px">`;
        wrap.appendChild(row1);

        const row2 = el('div'); row2.className = 'row';
        row2.innerHTML = `<label style="width:90px">Day</label><input type="number" id="time-day" value="${(window.$gameSystem && $gameSystem.chronus) ? $gameSystem.chronus().getDay() : $gameVariables.value(chronusFallbackVars.day)||1}" min="1" style="width:90px"><label style="width:60px">Hour</label><input type="number" id="time-hour" value="${(window.$gameSystem && $gameSystem.chronus) ? $gameSystem.chronus().getHour() : $gameVariables.value(chronusFallbackVars.hour)||0}" min="0" max="23" style="width:70px"><label style="width:60px">Minute</label><input type="number" id="time-minute" value="${(window.$gameSystem && $gameSystem.chronus) ? $gameSystem.chronus().getMinute() : $gameVariables.value(chronusFallbackVars.minute)||0}" min="0" max="59" style="width:70px">`;
        wrap.appendChild(row2);

        const btnRow = el('div'); btnRow.className = 'row';
        btnRow.innerHTML = `<button class="btn small" id="time-apply">Set Date & Time (Chronus)</button>
                            <button class="btn small" id="time-apply-vars">Set & also write common vars</button>
                            <button class="btn small" id="time-refresh">Refresh</button>
                            <div class="sub">If Chronus exists it will be used; otherwise variables will be written.</div>`;
        wrap.appendChild(btnRow);
        container.appendChild(wrap);

        // handlers
        const applyBtn = btnRow.querySelector('#time-apply');
        bindPointerOnce(applyBtn, 'pointerup', (e)=>{ e.preventDefault(); applyChronusTime(false); });
        applyBtn.addEventListener('click', ()=>applyChronusTime(false));

        const applyVarsBtn = btnRow.querySelector('#time-apply-vars');
        bindPointerOnce(applyVarsBtn, 'pointerup', (e)=>{ e.preventDefault(); applyChronusTime(true); });
        applyVarsBtn.addEventListener('click', ()=>applyChronusTime(true));

        const refreshBtn = btnRow.querySelector('#time-refresh');
        bindPointerOnce(refreshBtn, 'pointerup', (e)=>{ e.preventDefault(); refreshFields(); });
        refreshBtn.addEventListener('click', refreshFields);

        function refreshFields(){
          if(window.$gameSystem && $gameSystem.chronus){
            const c = $gameSystem.chronus();
            document.getElementById('time-year').value = c.getYear();
            document.getElementById('time-month').value = c.getMonth();
            document.getElementById('time-day').value = c.getDay();
            document.getElementById('time-hour').value = c.getHour();
            document.getElementById('time-minute').value = c.getMinute();
          } else {
            // fill from vars if present
            try {
              document.getElementById('time-month').value = Number($gameVariables.value(chronusFallbackVars.month)) || 1;
              document.getElementById('time-day').value = Number($gameVariables.value(chronusFallbackVars.day)) || 1;
              document.getElementById('time-hour').value = Number($gameVariables.value(chronusFallbackVars.hour)) || 0;
              document.getElementById('time-minute').value = Number($gameVariables.value(chronusFallbackVars.minute)) || 0;
            } catch(e) {}
          }
        }

        function applyChronusTime(writeVarsToo){
          const y = parseInt(document.getElementById('time-year').value, 10);
          const m = parseInt(document.getElementById('time-month').value, 10);
          const d = parseInt(document.getElementById('time-day').value, 10);
          const h = parseInt(document.getElementById('time-hour').value, 10);
          const mi = parseInt(document.getElementById('time-minute').value, 10);
          if([y,m,d,h,mi].some(v => isNaN(v))){
            alert('Invalid date/time values.');
            return;
          }
          try {
            if(window.$gameSystem && $gameSystem.chronus){
              // Use Chronus API (preferred) — keep Chronus's own refresh logic
              $gameSystem.chronus().setDay(y, m, d);
              $gameSystem.chronus().setTime(h, mi);
              // Chronus.demandRefresh already called inside setDay/setTime in plugin; no extra refresh required
            } else {
              // fallback: write to variables if known IDs
              if(typeof $gameVariables !== 'undefined'){
                if(chronusFallbackVars.month) $gameVariables.setValue(chronusFallbackVars.month, m);
                if(chronusFallbackVars.day) $gameVariables.setValue(chronusFallbackVars.day, d);
                if(chronusFallbackVars.hour) $gameVariables.setValue(chronusFallbackVars.hour, h);
                if(chronusFallbackVars.minute) $gameVariables.setValue(chronusFallbackVars.minute, mi);
              }
            }
            if(writeVarsToo && typeof $gameVariables !== 'undefined'){
              // also write common known vars
              if(chronusFallbackVars.weekday) $gameVariables.setValue(chronusFallbackVars.weekday, (window.$gameSystem && $gameSystem.chronus) ? $gameSystem.chronus().getWeekIndex() : 0);
            }
            alert('Time/date applied.');
            refreshFields();
          } catch(e){
            console.error(e);
            alert('Failed to set time: '+(e && e.message ? e.message : e));
          }
        }

        // initial fill
        refreshFields();
      }

      /* =========================
         Vars Tab
         ========================= */
      function renderVarsTab(container){
        const wrap = el('div');
        if(!window.$dataSystem || !window.$gameVariables || !window.$gameSwitches){
          wrap.textContent = 'Game not loaded yet.';
          container.appendChild(wrap);
          return;
        }

        const varRow = el('div');
        varRow.className = 'row';
        varRow.innerHTML =
          `<label>Variable</label>
           <select id="cheat-var-select" style="width:220px"></select>
           <button class="btn small" id="cheat-var-refresh">Refresh</button>`;
        wrap.appendChild(varRow);

        const varEdit = el('div');
        varEdit.className = 'row';
        varEdit.innerHTML =
          `<label>Value</label>
           <input type="number" id="cheat-var-value" value="0">
           <button class="btn small" id="cheat-var-set">Set</button>
           <button class="btn small" id="cheat-var-add">+1</button>`;
        wrap.appendChild(varEdit);

        const swRow = el('div');
        swRow.className = 'row';
        swRow.innerHTML =
          `<label>Switch</label>
           <select id="cheat-sw-select" style="width:220px"></select>
           <button class="btn small" id="cheat-sw-refresh">Refresh</button>`;
        wrap.appendChild(swRow);

        const swEdit = el('div');
        swEdit.className = 'row';
        swEdit.innerHTML =
          `<label>Value</label>
           <select id="cheat-sw-value"><option value="1">ON</option><option value="0">OFF</option></select>
           <button class="btn small" id="cheat-sw-set">Set</button>`;
        wrap.appendChild(swEdit);

        function populateVarsAndSwitches(){
          const varSelect = document.getElementById('cheat-var-select');
          varSelect.innerHTML = '';
          const vars = $dataSystem && $dataSystem.variables ? $dataSystem.variables : [];
          for(let i=1;i<vars.length;i++){
            const name = vars[i] && vars[i].length ? vars[i] : `Var ${i}`;
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `${i} — ${name}`;
            varSelect.appendChild(opt);
          }

          const swSelect = document.getElementById('cheat-sw-select');
          swSelect.innerHTML = '';
          const sws = $dataSystem && $dataSystem.switches ? $dataSystem.switches : [];
          for(let i=1;i<sws.length;i++){
            const name = sws[i] && sws[i].length ? sws[i] : `Switch ${i}`;
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `${i} — ${name}`;
            swSelect.appendChild(opt);
          }

          updateVarPreview();
          updateSwPreview();
        }

        function updateVarPreview(){
          const sel = document.getElementById('cheat-var-select');
          const id = Number(sel.value) || 0;
          const cur = $gameVariables.value(id);
          document.getElementById('cheat-var-value').value = (typeof cur !== 'undefined' ? cur : '');
        }
        function updateSwPreview(){
          const sel = document.getElementById('cheat-sw-select');
          const id = Number(sel.value) || 0;
          const cur = $gameSwitches.value(id) ? 1 : 0;
          document.getElementById('cheat-sw-value').value = cur;
        }

        wrap.querySelector('#cheat-var-refresh').addEventListener('click', populateVarsAndSwitches);
        wrap.querySelector('#cheat-var-set').addEventListener('click', ()=>{
          const id = Number(document.getElementById('cheat-var-select').value);
          const v = parseInt(document.getElementById('cheat-var-value').value, 10);
          if(!isNaN(id) && !isNaN(v)) {
            $gameVariables.setValue(id, v);
            alert(`Var ${id} set to ${v}`);
          }
        });
        wrap.querySelector('#cheat-var-add').addEventListener('click', ()=>{
          const id = Number(document.getElementById('cheat-var-select').value);
          const cur = Number($gameVariables.value(id) || 0);
          $gameVariables.setValue(id, cur + 1);
          updateVarPreview();
        });

        wrap.querySelector('#cheat-sw-refresh').addEventListener('click', populateVarsAndSwitches);
        wrap.querySelector('#cheat-sw-set').addEventListener('click', ()=>{
          const id = Number(document.getElementById('cheat-sw-select').value);
          const v = Number(document.getElementById('cheat-sw-value').value) === 1;
          if(!isNaN(id)){
            $gameSwitches.setValue(id, v);
            alert(`Switch ${id} set to ${v ? 'ON' : 'OFF'}`);
          }
        });

        document.addEventListener('change', (e)=>{ /* nothing here - UI handled by controls */ });

        document.getElementById('cheat-var-select').addEventListener('change', updateVarPreview);
        document.getElementById('cheat-sw-select').addEventListener('change', updateSwPreview);

        container.appendChild(wrap);
        // initial populate
        populateVarsAndSwitches();
      }

      /* =========================
         Settings Tab
         ========================= */
      function renderSettingsTab(container){
        const wrap = el('div');
        wrap.innerHTML =
          `<div class="row">
             <label>Auto-save</label>
             <select id="autosave-interval" style="width:120px">
               <option value="300000">5 min</option>
               <option value="600000">10 min</option>
               <option value="900000">15 min</option>
               <option value="1200000">20 min</option>
               <option value="1800000">30 min</option>
             </select>
             <label style="width:70px">Slot</label>
             <select id="autosave-slot" style="width:80px">
               <option value="1">1</option><option value="2">2</option><option value="3">3</option>
               <option value="4">4</option><option value="5">5</option><option value="6">6</option>
             </select>
             <button class="btn small" id="autosave-toggle">Enable</button>
           </div>

           <div class="row">
             <button class="btn small" id="save-now">Save Now</button>
             <button class="btn small" id="load-now">Load Now</button>
             <select id="manual-slot" style="width:90px">
               <option value="1">slot 1</option><option value="2">slot 2</option><option value="3">slot 3</option>
               <option value="4">slot 4</option><option value="5">slot 5</option><option value="6">slot 6</option>
             </select>
           </div>

           <div class="row"><span id="settingsStatus" class="status">Auto-save: OFF</span></div>

           <div class="row">
             <button class="btn small" id="force-open-save-menu">Force open Save menu</button>
             <button class="btn small" id="force-open-load-menu">Force open Load menu</button>
           </div>

           <div class="sub">Auto-save is OFF by default (won't persist across reloads).</div>`;
        container.appendChild(wrap);

        const intSel = document.getElementById('autosave-interval');
        const slotSel = document.getElementById('autosave-slot');
        const toggleBtn = document.getElementById('autosave-toggle');
        const manualSlot = document.getElementById('manual-slot');
        const saveNowBtn = document.getElementById('save-now');
        const loadNowBtn = document.getElementById('load-now');

        // initial UI defaults
        intSel.value = String(autosaveIntervalMs);
        slotSel.value = String(autosaveSlot);
        renderSettingsStatus();

        intSel.addEventListener('change', ()=> {
          autosaveIntervalMs = Number(intSel.value);
          if(autosaveEnabled) enableAutosave(true);
          renderSettingsStatus();
        });
        slotSel.addEventListener('change', ()=> {
          autosaveSlot = Number(slotSel.value);
          renderSettingsStatus();
        });
        toggleBtn.addEventListener('click', ()=> {
          enableAutosave(!autosaveEnabled);
          toggleBtn.textContent = autosaveEnabled ? 'Disable' : 'Enable';
        });

        saveNowBtn.addEventListener('click', ()=> {
          const s = Number(manualSlot.value) || 1;
          doSave(s, false);
        });
        loadNowBtn.addEventListener('click', ()=> {
          const s = Number(manualSlot.value) || 1;
          if(confirm('Load slot '+s+'? Current progress will be replaced.')) doLoad(s);
        });

        document.getElementById('force-open-save-menu').addEventListener('click', ()=> {
          try { if(window.SceneManager) SceneManager.push(Scene_Save); else alert('Scene_Save unavailable'); } catch(e){ alert('Cannot open save menu: '+e.message); }
        });
        document.getElementById('force-open-load-menu').addEventListener('click', ()=> {
          try { if(window.SceneManager) SceneManager.push(Scene_Load); else alert('Scene_Load unavailable'); } catch(e){ alert('Cannot open load menu: '+e.message); }
        });

        renderSettingsStatus();
      }

      /* =========================
         ESC button - single trigger debounced
         ========================= */
      (function(){
        let disabled = false;
        function openMenuDirect(){
          try {
            if (window.SceneManager && SceneManager._scene) {
              const sc = SceneManager._scene;
              if (window.Scene_Map && sc instanceof Scene_Map) {
                if (window.$gamePlayer && $gamePlayer.canMove && $gamePlayer.canMove()) {
                  if (window.SoundManager && SoundManager.playOk) SoundManager.playOk();
                  if (window.Window_MenuCommand && Window_MenuCommand.initCommandPosition) {
                    Window_MenuCommand.initCommandPosition();
                  }
                  SceneManager.push(Scene_Menu);
                  return true;
                }
              }
              // fallback: if a scene stack exists, pop
              if (SceneManager._stack && SceneManager._stack.length > 1) {
                if(typeof SceneManager.pop === 'function') SceneManager.pop();
                else if(typeof SceneManager.goto === 'function') SceneManager.goto(Scene_Map);
                return true;
              }
            }
          } catch(e){}
          return false;
        }
        function onEscPress(e){
          try { if(e && e.preventDefault) e.preventDefault(); } catch(_) {}
          if(disabled) return;
          disabled = true;
          setTimeout(()=> disabled = false, 450); // small debounce
          if(!openMenuDirect()){
            try {
              const ev = new KeyboardEvent('keydown', {key:'Escape', code:'Escape', bubbles:true, cancelable:true});
              Object.defineProperty(ev, 'keyCode', {get: ()=>27});
              Object.defineProperty(ev, 'which', {get: ()=>27});
              document.dispatchEvent(ev);
              window.dispatchEvent(ev);
              setTimeout(()=> {
                const ev2 = new KeyboardEvent('keyup', {key:'Escape', code:'Escape', bubbles:true, cancelable:true});
                Object.defineProperty(ev2, 'keyCode', {get: ()=>27});
                Object.defineProperty(ev2, 'which', {get: ()=>27});
                document.dispatchEvent(ev2);
                window.dispatchEvent(ev2);
              }, 16);
            } catch(_) {}
          }
        }
        // pointer events for robust touch+mouse support
        bindPointerOnce(escBtn, 'pointerup', (e)=>{ e.preventDefault(); onEscPress(e); });
        escBtn.addEventListener('click', onEscPress);
        escBtn.setAttribute('ontouchstart','void(0)');
      })();

      /* =========================
         Fixes & initialization
         ========================= */

      // prevent certain touch default behaviors when the cheat panel is open
      // But keep pointer events functioning for panel controls.
      document.addEventListener('touchmove', function(e){
        if(panel.classList.contains('open')) {
          // Prevent page scroll when interacting inside open cheat panel (but allow inner scrollers)
          // Only cancel when touching outside scrollable content? Simpler: prevent default on body-level touchmove while open.
          e.preventDefault();
        }
      }, {passive:false});

      // Ensure some interactive elements don't remain unresponsive after first use on certain Android webviews:
      // When panel is closed, remove pointer-capture from any element.
      function releasePointerCaptures(){
        try {
          if (typeof document.releasePointerCapture === 'function') {
            // best-effort: release on doc
          }
        } catch(e){}
      }

      // ensure autosave is OFF initially
      enableAutosave(false);

      // default tab when opening
      window.__renderCheat = function(tab){ showCheatTab(tab || 'money'); };

      // make sure panel doesn't block keyboard input to game if hidden
      panel.setAttribute('aria-hidden','true');

      // Expose for debugging
      window.__cheat = {
        open: openPanel,
        close: closePanel,
        save: doSave,
        load: doLoad,
        enableAutosave: function(v){ enableAutosave(!!v); }
      };

    })();
    </script>
  </body>
</html>
